# Runs every verification command from docs/VerificationTools.md (section 8).
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: 문서 링크·고아 문서
        run: uv run python -m tools.check_docs
      - name: 문서 ↔ 코드 포인터
        run: uv run python -m tools.check_pointers
      - name: 작업 관리 문서 정합성
        run: uv run python -m tools.check_tasks
      - name: 커밋 메시지 이력
        run: uv run python -m tools.check_commits
      - name: 웹 화면 파일의 외부 주소와 라이브러리
        run: uv run python -m tools.check_web
      - name: PR 제목과 브랜치 이름
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: uv run python -m tools.check_commits --subject "$PR_TITLE" --branch "$BRANCH"
      - name: 앞선 열린 PR 포함 여부
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName,headRefOid > "$RUNNER_TEMP/open-prs.json"
          uv run python -m tools.check_pr_order --pr "$PR_NUMBER" --open-prs "$RUNNER_TEMP/open-prs.json"
      - name: 테스트
        run: uv run python -m unittest discover -s tests -t .
